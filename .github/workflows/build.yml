name: build-ksu-331-kdp

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  lkm:
    name: Build KernelSU 3.3.1 LKM
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
      options: --privileged
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Fetch KernelSU v3.3.1
        run: |
          git clone --branch v3.3.1 https://github.com/tiann/KernelSU.git KernelSU
          if ls patches/*.patch >/dev/null 2>&1; then
            cd KernelSU
            for p in ../patches/*.patch; do
              echo "applying $p"
              git apply "$p"
            done
          else
            echo "no patches yet - building stock KernelSU"
          fi

      - name: Build kernelsu.ko
        run: |
          cd KernelSU/kernel
          REL="6.1.145-android14-11-3254743-abS9280ZCS6DZJ3"
          echo "$REL" > /opt/ddk/kdir/android14-6.1/include/config/kernel.release
          sed -i "s|^#define UTS_RELEASE .*|#define UTS_RELEASE \"$REL\"|" /opt/ddk/kdir/android14-6.1/include/generated/utsrelease.h
          CONFIG_KSU=m CONFIG_KSU_SAMSUNG_KDP=y CONFIG_KSU_SAMSUNG_RKP=y CONFIG_KSU_SAMSUNG_DEFEX=y CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y CC=clang make -j"$(nproc)"
          llvm-strip -d kernelsu.ko
          python3 - 0xea759d7f kernelsu.ko <<'PY'
          import struct, sys
          crc=int(sys.argv[1],16); dst=sys.argv[2]
          d=bytearray(open(dst,'rb').read())
          so=struct.unpack_from('<Q',d,0x28)[0]; es=struct.unpack_from('<H',d,0x3a)[0]
          n=struct.unpack_from('<H',d,0x3c)[0]; si=struct.unpack_from('<H',d,0x3e)[0]
          sh=[]
          for i in range(n):
              h=so+i*es; v=struct.unpack_from('<IIQQQQIIQQ',d,h); sh.append({'hdr':h,'name':v[0],'off':v[4],'size':v[5]})
          st=d[sh[si]['off']:sh[si]['off']+sh[si]['size']]
          nm=lambda x: st[x:st.find(b'\0',x)].decode(errors='replace') if x<len(st) else ''
          vers=[s for s in sh if nm(s['name'])=='__versions'][0]
          ent=struct.pack('<Q',crc)+b'module_layout'.ljust(56,b'\0')
          o=len(d); d+=ent
          struct.pack_into('<Q',d,vers['hdr']+0x18,o); struct.pack_into('<Q',d,vers['hdr']+0x20,len(ent))
          open(dst,'wb').write(bytes(d))
          PY
          ls -l kernelsu.ko
          strings kernelsu.ko | grep vermagic

      - name: Upload LKM
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-331-lkm
          path: KernelSU/kernel/kernelsu.ko

  ksud:
    name: Build KernelSU 3.3.1 ksud
    needs: lkm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Fetch KernelSU v3.3.1
        run: |
          git clone --branch v3.3.1 https://github.com/tiann/KernelSU.git KernelSU
          if ls patches/*.patch >/dev/null 2>&1; then
            cd KernelSU
            for p in ../patches/*.patch; do
              echo "applying $p"
              git apply "$p"
            done
          fi

      - name: Download LKM artifact
        uses: actions/download-artifact@v4
        with:
          name: kernelsu-331-lkm
          path: lkm

      - name: Embed KDP LKM into ksud
        run: |
          mkdir -p KernelSU/userspace/ksud/bin/aarch64
          cp lkm/kernelsu.ko KernelSU/userspace/ksud/bin/aarch64/android14-6.1_kernelsu.ko
          ls -l KernelSU/userspace/ksud/bin/aarch64/

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - name: Setup NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd KernelSU
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml

      - name: Upload ksud
        uses: actions/upload-artifact@v4
        with:
          name: ksud-331-aarch64
          path: KernelSU/target/aarch64-linux-android/release/ksud
